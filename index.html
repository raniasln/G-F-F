<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggregatzustände - Interaktive Simulation</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDarkBlue: '#0B253B',
            brandVividGreen: '#02ECA6',
            brandWarmOrange: '#FF774B',
            brandWarmGrey: '#F2EFED',
            brandTuvBlue: '#0046AD'
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Embed guard to eliminate vertical scrollbars */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F2EFED;
      color: #0B253B;
      user-select: none;
      -webkit-user-select: none;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .chamber-vessel {
      background: radial-gradient(ellipse at 50% 20%, #173b5a 0%, #0B253B 100%);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.6);
    }
    /* Active Button States */
    .btn-active-gas {
      background-color: #0B253B !important;
      color: #ffffff !important;
      border-color: #02ECA6 !important;
      box-shadow: 0 4px 12px rgba(2, 236, 166, 0.25);
    }
    .btn-active-liquid {
      background-color: #0B253B !important;
      color: #ffffff !important;
      border-color: #0046AD !important;
      box-shadow: 0 4px 12px rgba(0, 70, 173, 0.3);
    }
    .btn-active-solid {
      background-color: #0B253B !important;
      color: #ffffff !important;
      border-color: #FF774B !important;
      box-shadow: 0 4px 12px rgba(255, 119, 75, 0.25);
    }
  </style>
</head>
<body class="p-1 sm:p-2 h-full flex flex-col justify-center">

  <!-- Main Card Container: Max height constrained for Easygenerator iframes -->
  <div class="w-full h-full max-h-[480px] bg-white rounded-xl shadow-md border border-slate-200/90 flex flex-col overflow-hidden">
    
    <!-- Top Header Bar with Language Switch -->
    <header class="bg-brandDarkBlue text-white px-3 sm:px-4 py-2 flex items-center justify-between flex-shrink-0 border-b-2 border-brandVividGreen">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-brandVividGreen animate-pulse"></span>
        <h1 id="ui-title" class="text-xs sm:text-sm font-semibold tracking-tight text-slate-100">
          Verhalten unter Druck: Aggregatzustände
        </h1>
      </div>

      <!-- Multilingual Selector (DE / EN / FR) -->
      <div class="flex items-center bg-slate-900/90 p-0.5 rounded-lg border border-slate-700/70">
        <button onclick="setLanguage('de')" id="lang-btn-de" class="px-2 py-0.5 rounded text-[11px] font-bold text-brandDarkBlue bg-brandVividGreen transition-colors">
          DE
        </button>
        <button onclick="setLanguage('en')" id="lang-btn-en" class="px-2 py-0.5 rounded text-[11px] font-medium text-slate-300 hover:text-white transition-colors">
          EN
        </button>
        <button onclick="setLanguage('fr')" id="lang-btn-fr" class="px-2 py-0.5 rounded text-[11px] font-medium text-slate-300 hover:text-white transition-colors">
          FR
        </button>
      </div>
    </header>

    <!-- Main Content Flow (Buttons -> Zustand Strip -> Molecular Chamber) -->
    <main class="flex flex-col flex-1 p-2.5 sm:p-3 gap-2 min-h-0 bg-brandWarmGrey/40 overflow-hidden">
      
      <!-- 1. THREE BUTTONS SIDE BY SIDE -->
      <div class="grid grid-cols-3 gap-2 sm:gap-3 flex-shrink-0">
        
        <!-- BUTTON 1: GAS -->
        <button id="btn-state-gas" onclick="toggleState('gas')" 
                class="btn-active-gas w-full px-2.5 sm:px-3.5 py-2 sm:py-2.5 rounded-lg border-2 text-left transition-all duration-150 flex items-center justify-between cursor-pointer active:scale-[0.99]">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-3 h-3 rounded-full bg-brandVividGreen flex-shrink-0"></span>
            <span id="title-gas" class="text-xs sm:text-sm font-bold truncate">Gas</span>
          </div>
          <span id="badge-gas" class="mono text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-full bg-brandVividGreen text-brandDarkBlue uppercase tracking-wider flex-shrink-0">
            AKTIV
          </span>
        </button>

        <!-- BUTTON 2: LIQUID -->
        <button id="btn-state-liquid" onclick="toggleState('liquid')" 
                class="bg-white hover:bg-slate-50 text-brandDarkBlue border-2 border-slate-200 w-full px-2.5 sm:px-3.5 py-2 sm:py-2.5 rounded-lg text-left transition-all duration-150 flex items-center justify-between cursor-pointer active:scale-[0.99]">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-3 h-3 rounded-full bg-brandTuvBlue opacity-60 flex-shrink-0"></span>
            <span id="title-liquid" class="text-xs sm:text-sm font-bold truncate">Flüssigkeit</span>
          </div>
          <span id="badge-liquid" class="mono text-[9px] sm:text-[10px] font-medium px-1.5 sm:px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 uppercase tracking-wider flex-shrink-0">
            WÄHLEN
          </span>
        </button>

        <!-- BUTTON 3: SOLID -->
        <button id="btn-state-solid" onclick="toggleState('solid')" 
                class="bg-white hover:bg-slate-50 text-brandDarkBlue border-2 border-slate-200 w-full px-2.5 sm:px-3.5 py-2 sm:py-2.5 rounded-lg text-left transition-all duration-150 flex items-center justify-between cursor-pointer active:scale-[0.99]">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-3 h-3 rounded-full bg-brandWarmOrange opacity-60 flex-shrink-0"></span>
            <span id="title-solid" class="text-xs sm:text-sm font-bold truncate">Feststoff</span>
          </div>
          <span id="badge-solid" class="mono text-[9px] sm:text-[10px] font-medium px-1.5 sm:px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 uppercase tracking-wider flex-shrink-0">
            WÄHLEN
          </span>
        </button>

      </div>

      <!-- 2. ZUSTAND STATUS STRIP DIRECTLY UNDER BUTTONS -->
      <div class="bg-white px-3 py-1.5 rounded-lg border border-slate-200/90 shadow-2xs flex items-center justify-between text-xs flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-slate-500 font-semibold" id="lbl-status">Zustand:</span>
          <span id="val-status" class="mono font-bold text-brandVividGreen">Freie Partikelbewegung</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="hidden sm:inline text-slate-400 text-[11px]" id="lbl-behaviour">Eigenschaft:</span>
          <span id="chamber-behavior" class="text-[11px] mono text-brandVividGreen font-semibold">Volle Expansion</span>
        </div>
      </div>

      <!-- 3. MOLECULAR SIMULATION CHAMBER DIRECTLY UNDER ZUSTAND -->
      <section class="flex-1 min-h-0 bg-brandDarkBlue rounded-xl p-2 border border-slate-700 shadow-inner flex flex-col justify-between">
        
        <div class="relative w-full flex-1 rounded-lg border border-slate-600/90 chamber-vessel overflow-hidden flex flex-col min-h-0">
          
          <!-- Interactive Molecule Canvas -->
          <canvas id="moleculeCanvas" class="w-full h-full cursor-grab active:cursor-grabbing block touch-none z-10 flex-1"></canvas>

          <!-- Interaction Hint -->
          <div class="absolute bottom-1.5 left-2 z-20 pointer-events-none bg-brandDarkBlue/85 backdrop-blur-xs px-2 py-0.5 rounded border border-slate-600/70 text-[9px] text-slate-300 flex items-center gap-1.5">
            <span>👆</span>
            <span id="hint-touch">Tippen oder ziehen zum Bewegen</span>
          </div>

          <!-- Impulse Agitation Button -->
          <div class="absolute bottom-1.5 right-2 z-20">
            <button onclick="toggleAgitation()" id="btn-impulse" class="px-2.5 py-0.5 rounded text-[10px] font-bold bg-brandTuvBlue hover:bg-blue-600 active:scale-95 text-white transition flex items-center gap-1 shadow-sm">
              ⚡ <span id="lbl-impulse">Impuls</span>
            </button>
          </div>

        </div>

      </section>

    </main>

  </div>

  <script>
    const I18N = {
      de: {
        uiTitle: "Verhalten unter Druck: Aggregatzustände",
        badgeActive: "AKTIV",
        badgeSelect: "WÄHLEN",
        lblStatus: "Zustand:",
        lblBehaviour: "Eigenschaft:",
        hintTouch: "Tippen oder ziehen zum Bewegen",
        lblImpulse: "Impuls",
        states: {
          gas: {
            title: "Gas",
            status: "Freie Partikelbewegung",
            behavior: "Volle Expansion"
          },
          liquid: {
            title: "Flüssigkeit",
            status: "Fließend & kohärent",
            behavior: "Konstantes Volumen"
          },
          solid: {
            title: "Feststoff",
            status: "Gitterstruktur fixiert",
            behavior: "Formbeständig"
          }
        }
      },
      en: {
        uiTitle: "Behaviour under Pressure: States of Matter",
        badgeActive: "ACTIVE",
        badgeSelect: "SELECT",
        lblStatus: "State:",
        lblBehaviour: "Property:",
        hintTouch: "Touch or drag to agitate",
        lblImpulse: "Agitate",
        states: {
          gas: {
            title: "Gas",
            status: "Free particle movement",
            behavior: "Full expansion"
          },
          liquid: {
            title: "Liquid",
            status: "Flowing & cohesive",
            behavior: "Constant volume"
          },
          solid: {
            title: "Solid",
            status: "Fixed lattice matrix",
            behavior: "Rigid form"
          }
        }
      },
      fr: {
        uiTitle: "Comportement sous pression : États de la matière",
        badgeActive: "ACTIF",
        badgeSelect: "CHOISIR",
        lblStatus: "État :",
        lblBehaviour: "Propriété :",
        hintTouch: "Toucher ou glisser pour agiter",
        lblImpulse: "Agiter",
        states: {
          gas: {
            title: "Gaz",
            status: "Mouvement libre des particules",
            behavior: "Expansion complète"
          },
          liquid: {
            title: "Liquide",
            status: "Fluide et cohésif",
            behavior: "Volume constant"
          },
          solid: {
            title: "Solide",
            status: "Structure cristalline fixe",
            behavior: "Forme rigide"
          }
        }
      }
    };

    let currentLang = 'de';
    let currentState = 'gas';

    function setLanguage(lang) {
      currentLang = lang;
      
      ['de', 'en', 'fr'].forEach(l => {
        const btn = document.getElementById(`lang-btn-${l}`);
        if (l === lang) {
          btn.className = "px-2 py-0.5 rounded text-[11px] font-bold text-brandDarkBlue bg-brandVividGreen transition-colors";
        } else {
          btn.className = "px-2 py-0.5 rounded text-[11px] font-medium text-slate-300 hover:text-white transition-colors";
        }
      });

      const t = I18N[lang];
      document.getElementById('ui-title').textContent = t.uiTitle;
      document.getElementById('lbl-status').textContent = t.lblStatus;
      document.getElementById('lbl-behaviour').textContent = t.lblBehaviour;
      document.getElementById('hint-touch').textContent = t.hintTouch;
      document.getElementById('lbl-impulse').textContent = t.lblImpulse;

      document.getElementById('title-gas').textContent = t.states.gas.title;
      document.getElementById('title-liquid').textContent = t.states.liquid.title;
      document.getElementById('title-solid').textContent = t.states.solid.title;

      applyStateUI(currentState);
    }

    function toggleState(state) {
      currentState = state;
      applyStateUI(state);
      resetParticlePositions(state);
    }

    function applyStateUI(state) {
      const t = I18N[currentLang];
      const data = t.states[state];

      ['gas', 'liquid', 'solid'].forEach(s => {
        const btn = document.getElementById(`btn-state-${s}`);
        const badge = document.getElementById(`badge-${s}`);

        if (s === state) {
          btn.className = `btn-active-${s} w-full px-2.5 sm:px-3.5 py-2 sm:py-2.5 rounded-lg border-2 text-left transition-all duration-150 flex items-center justify-between cursor-pointer active:scale-[0.99]`;
          badge.textContent = t.badgeActive;
          
          if (s === 'gas') {
            badge.className = "mono text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-full bg-brandVividGreen text-brandDarkBlue uppercase tracking-wider flex-shrink-0";
          } else if (s === 'liquid') {
            badge.className = "mono text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-full bg-blue-500 text-white uppercase tracking-wider flex-shrink-0";
          } else {
            badge.className = "mono text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-full bg-brandWarmOrange text-white uppercase tracking-wider flex-shrink-0";
          }
        } else {
          btn.className = "bg-white hover:bg-slate-50 text-brandDarkBlue border-2 border-slate-200 w-full px-2.5 sm:px-3.5 py-2 sm:py-2.5 rounded-lg text-left transition-all duration-150 flex items-center justify-between cursor-pointer active:scale-[0.99]";
          badge.textContent = t.badgeSelect;
          badge.className = "mono text-[9px] sm:text-[10px] font-medium px-1.5 sm:px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 uppercase tracking-wider flex-shrink-0";
        }
      });

      document.getElementById('chamber-behavior').textContent = data.behavior;
      document.getElementById('val-status').textContent = data.status;

      const behavior = document.getElementById('chamber-behavior');
      const status = document.getElementById('val-status');

      if (state === 'gas') {
        behavior.className = "text-[11px] mono text-brandVividGreen font-semibold";
        status.className = "mono font-bold text-brandVividGreen";
      } else if (state === 'liquid') {
        behavior.className = "text-[11px] mono text-blue-400 font-semibold";
        status.className = "mono font-bold text-brandTuvBlue";
      } else {
        behavior.className = "text-[11px] mono text-brandWarmOrange font-semibold";
        status.className = "mono font-bold text-brandWarmOrange";
      }
    }
  </script>

  <script>
    const canvas = document.getElementById('moleculeCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    const dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const PARTICLE_COUNT = 48;
    const PARTICLE_RADIUS = 6.5;
    const particles = [];
    const pointer = { x: -1000, y: -1000, active: false, radius: 50 };

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        gridX: 0,
        gridY: 0,
        radius: PARTICLE_RADIUS
      });
    }

    function calculateSolidGrid() {
      const cols = 8;
      const rows = 6;
      const spacing = PARTICLE_RADIUS * 2.35;
      const gridW = (cols - 1) * spacing;
      const startX = (width - gridW) / 2;
      const startY = height - (rows * spacing) - 10;

      particles.forEach((p, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const stagger = (row % 2 === 1) ? (spacing * 0.5) : 0;
        p.gridX = startX + (col * spacing) + stagger;
        p.gridY = startY + (row * (spacing * 0.9));
      });
    }

    function resetParticlePositions(state) {
      calculateSolidGrid();
      particles.forEach((p) => {
        if (state === 'gas') {
          p.x = PARTICLE_RADIUS + Math.random() * (width - PARTICLE_RADIUS * 2);
          p.y = PARTICLE_RADIUS + Math.random() * (height - PARTICLE_RADIUS * 2);
          const speed = 3.5 + Math.random() * 1.5;
          const theta = Math.random() * Math.PI * 2;
          p.vx = Math.cos(theta) * speed;
          p.vy = Math.sin(theta) * speed;
        } else if (state === 'liquid') {
          p.x = width * 0.15 + Math.random() * (width * 0.7);
          p.y = height * 0.45 + Math.random() * (height * 0.5);
          p.vx = (Math.random() - 0.5) * 1.5;
          p.vy = (Math.random() - 0.5) * 1.5;
        } else {
          p.x = p.gridX + (Math.random() - 0.5) * 2;
          p.y = p.gridY + (Math.random() - 0.5) * 2;
          p.vx = 0;
          p.vy = 0;
        }
      });
    }

    function toggleAgitation() {
      particles.forEach(p => {
        const impulse = 5.0;
        p.vx += (Math.random() - 0.5) * impulse;
        p.vy -= Math.random() * impulse;
      });
    }

    function updatePhysics() {
      const pad = PARTICLE_RADIUS;
      const left = pad;
      const right = width - pad;
      const top = pad;
      const bottom = height - pad;

      if (currentState === 'gas') {
        const targetSpeed = 3.6;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p2.x - p.x;
            const dy = p2.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const minDist = PARTICLE_RADIUS * 2;
            if (dist < minDist) {
              const nx = dx / dist;
              const ny = dy / dist;
              const kx = p.vx - p2.vx;
              const ky = p.vy - p2.vy;
              const pVel = nx * kx + ny * ky;
              p.vx -= pVel * nx;
              p.vy -= pVel * ny;
              p2.vx += pVel * nx;
              p2.vy += pVel * ny;

              const overlap = (minDist - dist) * 0.5;
              p.x -= nx * overlap;
              p.y -= ny * overlap;
              p2.x += nx * overlap;
              p2.y += ny * overlap;
            }
          }
          const curSpeed = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 0.1;
          p.vx = (p.vx / curSpeed) * (targetSpeed * 0.95 + curSpeed * 0.05);
          p.vy = (p.vy / curSpeed) * (targetSpeed * 0.95 + curSpeed * 0.05);

          p.x += p.vx;
          p.y += p.vy;

          if (p.x <= left) { p.x = left; p.vx = Math.abs(p.vx); }
          if (p.x >= right) { p.x = right; p.vx = -Math.abs(p.vx); }
          if (p.y <= top) { p.y = top; p.vy = Math.abs(p.vy); }
          if (p.y >= bottom) { p.y = bottom; p.vy = -Math.abs(p.vy); }
        }

      } else if (currentState === 'liquid') {
        const gravity = 0.22;
        const jitter = 0.35;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.vy += gravity;
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p2.x - p.x;
            const dy = p2.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const minDist = PARTICLE_RADIUS * 2.1;
            if (dist < minDist) {
              const overlap = (minDist - dist) * 0.5;
              const nx = dx / dist;
              const ny = dy / dist;
              p.x -= nx * overlap * 0.5;
              p.y -= ny * overlap * 0.5;
              p2.x += nx * overlap * 0.5;
              p2.y += ny * overlap * 0.5;

              p.vx -= nx * 0.1;
              p.vy -= ny * 0.1;
              p2.vx += nx * 0.1;
              p2.vy += ny * 0.1;
            }
          }
          p.vx += (Math.random() - 0.5) * jitter;
          p.vy += (Math.random() - 0.5) * jitter;
          p.vx *= 0.92;
          p.vy *= 0.92;

          p.x += p.vx;
          p.y += p.vy;

          if (p.x < left) { p.x = left; p.vx *= -0.3; }
          if (p.x > right) { p.x = right; p.vx *= -0.3; }
          if (p.y < top) { p.y = top; p.vy *= -0.2; }
          if (p.y > bottom) { p.y = bottom; p.vy *= -0.3; }
        }

      } else if (currentState === 'solid') {
        particles.forEach(p => {
          const dx = p.gridX - p.x;
          const dy = p.gridY - p.y;
          p.vx += dx * 0.22;
          p.vy += dy * 0.22;
          p.vx *= 0.72;
          p.vy *= 0.72;

          p.vx += (Math.random() - 0.5) * 0.35;
          p.vy += (Math.random() - 0.5) * 0.35;

          p.x += p.vx;
          p.y += p.vy;
        });
      }

      // Pointer Interactive Agitation
      if (pointer.active) {
        particles.forEach(p => {
          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < pointer.radius && dist > 0) {
            const force = (pointer.radius - dist) / pointer.radius;
            const angle = Math.atan2(dy, dx);
            const imp = force * 6.0;
            p.vx += Math.cos(angle) * imp;
            p.vy += Math.sin(angle) * imp;
          }
        });
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Faint background chamber grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      const step = 16;
      for (let x = 0; x < width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Solid crystal lattice bonds
      if (currentState === 'solid') {
        ctx.strokeStyle = 'rgba(255, 119, 75, 0.26)';
        ctx.lineWidth = 1.2;
        const bondLimit = PARTICLE_RADIUS * 2.7;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            if (Math.sqrt(dx * dx + dy * dy) < bondLimit) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }

      // Gas velocity vector trails
      if (currentState === 'gas') {
        ctx.strokeStyle = 'rgba(2, 236, 166, 0.35)';
        ctx.lineWidth = 1.2;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 2.8, p.y - p.vy * 2.8);
          ctx.stroke();
        });
      }

      // Particle rendering with corporate colors
      particles.forEach(p => {
        const grad = ctx.createRadialGradient(
          p.x - p.radius * 0.35,
          p.y - p.radius * 0.35,
          p.radius * 0.1,
          p.x,
          p.y,
          p.radius
        );

        if (currentState === 'gas') {
          // Vivid Green (#02ECA6)
          grad.addColorStop(0, '#a7fbe3');
          grad.addColorStop(0.45, '#02ECA6');
          grad.addColorStop(1, '#008b60');
        } else if (currentState === 'liquid') {
          // TÜV SÜD Blue (#0046AD)
          grad.addColorStop(0, '#9dc1ff');
          grad.addColorStop(0.5, '#0046AD');
          grad.addColorStop(1, '#00255c');
        } else {
          // Warm Orange (#FF774B)
          grad.addColorStop(0, '#ffcebf');
          grad.addColorStop(0.5, '#FF774B');
          grad.addColorStop(1, '#a63310');
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.shadowColor = currentState === 'gas' ? '#02ECA6' : (currentState === 'solid' ? '#FF774B' : '#0046AD');
        ctx.shadowBlur = currentState === 'gas' ? 6 : 3;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Specular reflection highlight
        ctx.beginPath();
        ctx.arc(p.x - p.radius * 0.35, p.y - p.radius * 0.35, p.radius * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();
      });
    }

    function loop() {
      updatePhysics();
      render();
      requestAnimationFrame(loop);
    }

    function setupInput() {
      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - r.left, y: clientY - r.top };
      }

      canvas.addEventListener('mousedown', (e) => {
        const p = getPos(e);
        pointer.x = p.x; pointer.y = p.y; pointer.active = true;
      });
      window.addEventListener('mousemove', (e) => {
        if (!pointer.active) return;
        const p = getPos(e);
        pointer.x = p.x; pointer.y = p.y;
      });
      window.addEventListener('mouseup', () => {
        pointer.active = false;
        pointer.x = -1000; pointer.y = -1000;
      });

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const p = getPos(e);
        pointer.x = p.x; pointer.y = p.y; pointer.active = true;
      }, { passive: false });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!pointer.active) return;
        const p = getPos(e);
        pointer.x = p.x; pointer.y = p.y;
      }, { passive: false });
      canvas.addEventListener('touchend', () => {
        pointer.active = false;
        pointer.x = -1000; pointer.y = -1000;
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        calculateSolidGrid();
      });
    }

    window.addEventListener('load', () => {
      resizeCanvas();
      setupInput();
      setLanguage('de');
      toggleState('gas');
      loop();
    });
  </script>
</body>
</html>
